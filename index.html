<!doctype html>

    <!--
      SHARE PREVIEW (WhatsApp, Facebook, X, LinkedIn...)
      %SITE_URL% is filled in automatically from vite.config.js.
      After you deploy, open vite.config.js and put your real website address in SITE_URL.
      (While developing on localhost it stays empty, so nothing outside is requested.)
    -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Azan" />
    <meta property="og:title" content="Azan — Professional Footballer from Pakistan" />

      property="og:description"
      content="Career, stats, photo gallery and contact for Azan, professional footballer from Pakistan."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Azan — professional footballer from Pakistan" />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Career, stats, photo gallery and contact for Azan, professional footballer from Pakistan."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Helps Google understand who this site is about -->

        "@context": "https://schema.org",

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
